name: Deploy API

on:
  push:
    branches: [dev1, production, stage]

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For use docker cache
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kinokonstructor-api:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/kinokonstructor-api:cache-${{ github.ref_name }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/kinokonstructor-api:cache-${{ github.ref_name }},mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Write env files on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          BRANCH: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$ENV_FILE" | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cat > /root/$BRANCH/api.env"

      - name: Pull, ReTag and Restart
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ORG: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             echo '${GHCR_TOKEN}' | docker login ghcr.io -u ${ORG} --password-stdin
             docker pull ghcr.io/${ORG}/kinokonstructor-api:${BRANCH}
             docker tag ghcr.io/${ORG}/kinokonstructor-api:${BRANCH} kinokonstructor-api:${BRANCH}
             cd /root/${BRANCH}
             docker-compose up -d --no-deps api"
